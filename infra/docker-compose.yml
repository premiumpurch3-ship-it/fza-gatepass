# Single-VPS production stack: Nginx (TLS) -> Next.js web + FastAPI api (+worker) -> PostgreSQL + MinIO. Only ports 80/443 are published.
name: gatepass
x-api-env: &api-env
  ENV: production
  DATABASE_URL: postgresql+psycopg://gatepass_app:${APP_DB_PASSWORD}@postgres:5432/gatepass
  SECRET_KEY: ${SECRET_KEY}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
  CORS_ORIGINS: https://${DOMAIN},https://localhost,capacitor://localhost,app://-
  DOCS_ENABLED: "false"
  STORAGE_BACKEND: s3
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: https://files.${DOMAIN}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  PUBLIC_BASE_URL: https://${DOMAIN}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-gatepass@localhost}
x-logging: &logging { driver: json-file, options: { max-size: "10m", max-file: "5" } }

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment: { POSTGRES_USER: gatepass_owner, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: gatepass }
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U gatepass_owner -d gatepass"], interval: 10s, timeout: 5s, retries: 10 }
    logging: *logging

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment: { MINIO_ROOT_USER: "${MINIO_ROOT_USER}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}" }
    volumes: [miniodata:/data]
    networks: [internal, edge]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 15s, timeout: 5s, retries: 10 }
    logging: *logging

  minio-init:
    image: minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    networks: [internal]
    restart: "no"
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/${S3_BUCKET} && mc version enable local/${S3_BUCKET} && mc anonymous set none local/${S3_BUCKET}; exit 0"
    environment: { MINIO_ROOT_USER: "${MINIO_ROOT_USER}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}" }

  migrate:
    build: { context: ../backend }
    image: gatepass-api:latest
    command: ["sh", "scripts/migrate.sh"]
    restart: "no"
    environment:
      <<: *api-env
      MIGRATION_DATABASE_URL: postgresql+psycopg://gatepass_owner:${POSTGRES_PASSWORD}@postgres:5432/gatepass
      DATABASE_URL: postgresql+psycopg://gatepass_owner:${POSTGRES_PASSWORD}@postgres:5432/gatepass
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD}
    depends_on: { postgres: { condition: service_healthy } }
    networks: [internal]

  api:
    image: gatepass-api:latest
    restart: unless-stopped
    environment: *api-env
    depends_on: { migrate: { condition: service_completed_successfully }, minio-init: { condition: service_completed_successfully } }
    networks: [internal, edge]
    logging: *logging

  worker:
    image: gatepass-api:latest
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment: *api-env
    depends_on: { migrate: { condition: service_completed_successfully } }
    networks: [internal]
    healthcheck: { test: ["CMD-SHELL", "pgrep -f app.worker || exit 1"], interval: 30s }
    logging: *logging

  web:
    build: { context: ../frontend, args: { NEXT_PUBLIC_API_URL: /api/v1, NEXT_PUBLIC_FILES_ORIGIN: "https://files.${DOMAIN}" } }
    image: gatepass-web:latest
    restart: unless-stopped
    networks: [edge]
    logging: *logging

  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certs:/etc/letsencrypt:ro
      - acme:/var/www/certbot:ro
    depends_on: [web, api, minio]
    networks: [edge]
    logging: *logging

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    volumes: [certs:/etc/letsencrypt, acme:/var/www/certbot]
    networks: [edge]

  backup:
    build: { context: ./backup }
    image: gatepass-backup:latest
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: gatepass
      PGUSER: gatepass_backup
      PGPASSWORD: ${BACKUP_DB_PASSWORD}
      DRILL_PGUSER: gatepass_owner
      DRILL_PGPASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE}
      OFFSITE_S3_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET:-}
      OFFSITE_S3_ACCESS_KEY: ${OFFSITE_S3_ACCESS_KEY:-}
      OFFSITE_S3_SECRET_KEY: ${OFFSITE_S3_SECRET_KEY:-}
    volumes: [backups:/backups]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [internal]
    logging: *logging

networks:
  internal: { internal: true }
  edge: {}
volumes: { pgdata: {}, miniodata: {}, certs: {}, acme: {}, backups: {} }
