# Development infrastructure only: PostgreSQL + MinIO (+ bucket creation). Run the API and Next.js on your machine (see README).
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: gatepass, POSTGRES_PASSWORD: devpass, POSTGRES_DB: gatepass }
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U gatepass"], interval: 5s, retries: 10 }
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin123 }
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin123; do sleep 1; done;
      mc mb -p local/gatepass-files; mc version enable local/gatepass-files; mc anonymous set none local/gatepass-files; exit 0"
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
volumes: { pgdata: {}, miniodata: {} }
